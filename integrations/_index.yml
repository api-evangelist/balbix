note: 'Balbix''s integration surface is its connector catalog: pre-built, API-based data collectors
  that pull assets, vulnerabilities, configurations and identity data from third-party security
  and IT systems into the Balbix unified asset model. Every entry below is a connector guide
  Balbix publishes in its own documentation. These are LISTING-ONLY entries: no Arazzo workflow
  is authored, because Balbix publishes no OpenAPI to bind the provider side of a two-source
  workflow to. arazzo is null for every row by design. network_repo is only set where the
  partner was matched to an API Evangelist catalog repo by verified company name, not by slug
  alone.'
