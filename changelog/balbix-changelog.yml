- title: Release Notes - June 2026
  date: '2026-06-01'
  url: https://docs.safe.security/balbixhelp/docs/release-notes-june-2026
  breaking: false
  highlights:
  - VulnCheck adopted as the threat intelligence feed provider, replacing Recorded
    Future.
  - Exposure Scores recalibrated against the new threat data — documented expected
    movement of 1-5 points for CVEs with existing tags and 1-20 points for CVEs
    without.
  - New vulnerability tags available - CISA Known Exploit, Exploit Kit Available,
    Known Exploit, Malware Linked, OWASP Top 10, Ransomware Linked.
  removals:
  - Recorded Future threat intelligence feed discontinued.
  api_changes: []
- title: Release Notes - August 2025
  date: '2025-08-01'
  url: https://docs.safe.security/balbixhelp/docs/release-notes-august-2025
  breaking: false
  highlights:
  - ServiceNow ITSM ticketing integration via the Balbix D3 connector, integrating
    directly with the ServiceNow Incident module.
  - Ticketing templates mapped to the ServiceNow catalog hierarchy (Catalogs,
    Categories, Items) with granular field-level control.
  api_changes: []
- title: Release Notes - May 2025
  date: '2025-05-23'
  url: https://docs.safe.security/balbixhelp/docs/release-notes-may-2025
  breaking: false
  product: Balbix Windows Host Analyzer (HA)
  category: Vulnerability Detection Enhancement
  highlights:
  - Enhanced detection of embedded software libraries via InstallLocation scanning,
    improving coverage of bundled libraries such as OpenSSL inside larger
    applications.
  limitations:
  - Only applications with a valid InstallLocation registry entry are scanned.
  - No banner-based parsing; detection is by file presence and metadata only.
  api_changes: []
- title: Release Notes - April 2025
  date: '2025-04-01'
  url: https://docs.safe.security/balbixhelp/docs/release-notes-1
  breaking: false
  highlights:
  - ServiceNow connector upgrade.
  api_changes: []
- title: Release Notes - March 2025
  date: '2025-03-01'
  url: https://docs.safe.security/balbixhelp/docs/servicenow-connector-upgrade
  breaking: false
  highlights:
  - ServiceNow ticketing connector enhancements, adding Requested Item (RITM) support
    for independent fulfillment, tasking and SLAs.
  - Ticketing templates aligned to the ServiceNow catalog hierarchy.
  api_changes: []
