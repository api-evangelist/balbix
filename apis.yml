aid: balbix
name: Balbix
description: 'Balbix is a cyber risk and exposure management platform founded in 2015
  in San Jose, California. The Balbix Security Cloud (Balbix D3) ingests telemetry from
  70+ security and IT systems through pre-built connectors and sensors, unifies it into
  a single asset, application, vulnerability and software inventory model, and quantifies
  breach risk in dollar terms so security teams can prioritize remediation. The platform
  covers cyber asset attack surface management (CAASM), continuous threat exposure
  management (CTEM), AppSec risk, and cyber risk quantification (CRQ), and ships BIX,
  a natural-language AI assistant for security posture questions. Balbix exposes a
  read-only REST API (v1) for programmatic access to assets, vulnerabilities,
  misconfigurations, software inventory, applications and application artifacts. Balbix
  was acquired by SAFE Security in November 2025; balbix.com now redirects to
  safe.security and the Balbix product documentation is published as the "Balbix Help"
  section of docs.safe.security.'
